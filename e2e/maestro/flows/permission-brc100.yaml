appId: org.bsvassociation.browser
---
# A page asks for a BRC-100 protocol key. Reject the sheet. Nothing is signed
# for a third party and nothing is broadcast.
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/ensure-wallet.yaml
- tapOn:
    id: wallet-back
- runFlow:
    file: ../subflows/go-to-url.yaml
    env:
      TARGET_URL: http://127.0.0.1:8787/protocol
- extendedWaitUntil:
    visible: "Authorize"
    timeout: 45000
- tapOn: "Reject"
- extendedWaitUntil:
    visible:
      id: e2e-status-protocol-rejected
    timeout: 20000
