appId: org.bsvassociation.browser
---
# A collapsed address bar uses the first tap to expand, and that tap unmounts
# nothing. An expanded bar opens the menu and unmounts the button immediately.
# Wait before deciding on a second tap, or the second tap races the unmount.
- tapOn:
    id: browser-menu-button
- extendedWaitUntil:
    visible:
      id: menu-wallet
    timeout: 8000
    optional: true
# The first tap opens the menu and unmounts the button. A second tap is only
# needed when the bar was collapsed, and it has to be optional so a menu that
# is still animating in does not fail the flow.
- tapOn:
    id: browser-menu-button
    optional: true
- extendedWaitUntil:
    visible:
      id: menu-wallet
    timeout: 10000
